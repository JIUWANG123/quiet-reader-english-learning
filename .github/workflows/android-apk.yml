name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain --stacktrace --max-workers=2
      - name: Verify bundled JavaScript
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          unzip -l "$apk" | grep -E 'assets/index.android.bundle|lib/arm64-v8a'
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-reader-1.11.6-release-apk
          path: android/app/build/outputs/apk/release/*.apk
